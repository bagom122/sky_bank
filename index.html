<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 문제은행 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn:hover { background-color: #f3f4f6; }
        .option-btn.selected { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                📚 스마트 문제은행 시스템
            </h1>
            <div class="flex items-center gap-3">
                <span id="load-status" class="text-xs text-gray-500">데이터 로딩 중...</span>
                <div id="mode-selector" class="flex gap-2">
                    <button onclick="switchMode('practice')" id="btn-mode-practice" class="px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition shadow-sm">연습형 모드</button>
                    <button onclick="switchMode('exam')" id="btn-mode-exam" class="px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200">실전 모의고사 (50문항)</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- [모드 1] 연습형 모드 화면 -->
        <div id="view-practice" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-800">연습 모드 학습</h2>
                    <p class="text-sm text-gray-500">순서대로 풀거나 랜덤으로 문제를 풀며 즉시 정답과 해설을 확인하세요.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="setPracticeOrder('sequential')" id="btn-seq" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-blue-600 bg-blue-50 text-blue-600 transition">순서대로</button>
                    <button onclick="setPracticeOrder('random')" id="btn-rand" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50">랜덤 풀기</button>
                </div>
            </div>

            <!-- 문제 카드 -->
            <div id="practice-card" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200 space-y-6">
                <div class="text-center py-12 text-gray-400">구글 드라이브에서 문제를 불러오는 중입니다...</div>
            </div>

            <!-- 이전/다음 내비게이션 -->
            <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <button onclick="movePracticeIndex(-1)" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition">← 이전 문제</button>
                <span id="practice-page-info" class="text-sm font-bold text-gray-600">0 / 0</span>
                <button onclick="movePracticeIndex(1)" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition shadow-sm">다음 문제 →</button>
            </div>
        </div>

        <!-- [모드 2] 실전 모의고사 모드 화면 -->
        <div id="view-exam" class="hidden space-y-6">
            <div id="exam-intro" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 text-center space-y-4">
                <h2 class="text-2xl font-bold text-gray-800">실전 모의고사 (50문항)</h2>
                <p class="text-gray-600 max-w-md mx-auto">전체 문제 중 50문항을 무작위로 추출하여 제한 시간(50분) 내에 풀고, 70점 이상 시 PASS 판정을 받습니다.</p>
                <button onclick="startExam()" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition">모의고사 시작하기</button>
            </div>

            <div id="exam-container" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 space-y-6">
                    <div id="exam-card" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200 space-y-6"></div>
                    <div class="flex justify-between bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                        <button onclick="moveExamIndex(-1)" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition">이전</button>
                        <button onclick="moveExamIndex(1)" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition shadow-sm">다음</button>
                    </div>
                </div>
                <!-- OMR 및 타이머 패널 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4 h-fit">
                    <div class="text-center pb-4 border-b">
                        <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">남은 시간</span>
                        <div id="exam-timer" class="text-3xl font-mono font-bold text-red-500 mt-1">50:00</div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-700 mb-2">OMR 답안지</h3>
                        <div id="omr-grid" class="grid grid-cols-5 gap-2 max-h-64 overflow-y-auto p-1"></div>
                    </div>
                    <button onclick="submitExam()" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition shadow-sm">답안 제출하기</button>
                </div>
            </div>

            <!-- 시험 결과 화면 -->
            <div id="exam-result" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-gray-200 text-center space-y-6">
                <h2 id="result-title" class="text-3xl font-bold">시험 결과</h2>
                <div id="result-score" class="text-5xl font-black text-blue-600">0점</div>
                <p id="result-desc" class="text-gray-600"></p>
                <button onclick="resetExam()" class="px-6 py-3 bg-gray-800 text-white font-bold rounded-xl hover:bg-gray-900 transition shadow-sm">다시 풀기</button>
            </div>
        </div>

    </main>

    <script>
        const FILE_ID = "1pJXOHnuSkIuDoadn1NKj76bl6YA5ons9";
        const DRIVE_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://drive.google.com/uc?export=download&id=${FILE_ID}`)}`;

        let questions = [];
        let currentMode = 'practice';
        let practiceOrder = 'sequential';
        let currentIndex = 0;
        let practiceIndexMap = [];
        let userAnswers = {};
        let examQuestions = [];
        let examTimer = null;
        let timeLeft = 3000;

        function parseQuestionBank(text) {
            const parsed = [];
            let currentCategory = "기본 분류";
            const lines = text.split(/\r?\n/);
            let i = 0;
            
            while (i < lines.length) {
                let line = lines[i].trim();
                
                if (line.startsWith('[') && line.endsWith(']')) {
                    currentCategory = line.slice(1, -1).trim();
                    i++;
                    continue;
                }
                
                const qMatch = line.match(/^(\d+)\[\.\s\]*(.+)$/) || line.match(/^(\d+)\.\s+(.+)$/);
                if (qMatch || /^\d+\./.test(line)) {
                    let qText = qMatch ? qMatch[2] : line.replace(/^\d+\.\s*/, '');
                    let options = [];
                    let answerNum = 1;
                    let explanationText = "";
                    
                    i++;
                    while (i < lines.length) {
                        let subLine = lines[i].trim();
                        if (subLine.startsWith('①') || subLine.startsWith('②') || subLine.startsWith('③') || subLine.startsWith('④') ||
                            subLine.startsWith('1)') || subLine.startsWith('2)') || subLine.startsWith('3)') || subLine.startsWith('4)')) {
                            options.push(subLine.replace(/^[①②③④1-4][\)\.]\s*/, ''));
                            i++;
                        } else {
                            break;
                        }
                    }
                    
                    while (i < lines.length) {
                        let subLine = lines[i].trim();
                        if (subLine.startsWith('정답:')) {
                            let ansStr = subLine.replace('정답:', '').trim();
                            if (ansStr.includes('①') || ansStr.startsWith('1')) answerNum = 1;
                            else if (ansStr.includes('②') || ansStr.startsWith('2')) answerNum = 2;
                            else if (ansStr.includes('③') || ansStr.startsWith('3')) answerNum = 3;
                            else if (ansStr.includes('④') || ansStr.startsWith('4')) answerNum = 4;
                            
                            if (ansStr.length > 3) {
                                explanationText = ansStr;
                            }
                            i++;
                        } else if (subLine.startsWith('해설:')) {
                            explanationText = subLine.replace('해설:', '').trim();
                            i++;
                        } else if (subLine === '' || subLine.startsWith('[') || /^\d+\./.test(subLine)) {
                            if (subLine === '') i++;
                            break;
                        } else {
                            if (explanationText) {
                                explanationText += " " + subLine;
                            } else {
                                explanationText = subLine;
                            }
                            i++;
                        }
                    }
                    
                    if (options.length > 0) {
                        parsed.push({
                            id: parsed.length + 1,
                            category: currentCategory,
                            question: qText,
                            options: options,
                            answer: answerNum,
                            explanation: explanationText || "등록된 해설이 없습니다."
                        });
                    }
                } else {
                    i++;
                }
            }
            return parsed;
        }

        async function loadDriveData() {
            const statusEl = document.getElementById('load-status');
            try {
                const response = await fetch(DRIVE_URL);
                if (!response.ok) throw new Error("네트워크 응답 실패");
                const text = await response.text();
                
                questions = parseQuestionBank(text);
                
                if (questions.length === 0) throw new Error("파싱된 문제가 없습니다.");

                statusEl.innerText = `총 ${questions.length}문항 연동 완료`;
                statusEl.className = "text-xs text-green-600 font-bold";
                init();
            } catch (error) {
                console.error(error);
                statusEl.innerText = "드라이브 연동 실패";
                statusEl.className = "text-xs text-red-500 font-bold";
                init();
            }
        }

        function init() {
            practiceIndexMap = questions.map((_, i) => i);
            renderPracticeQuestion();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('view-practice').classList.toggle('hidden', mode !== 'practice');
            document.getElementById('view-exam').classList.toggle('hidden', mode !== 'exam');
            document.getElementById('btn-mode-practice').className = mode === 'practice' ? 'px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition shadow-sm' : 'px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200';
            document.getElementById('btn-mode-exam').className = mode === 'exam' ? 'px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition shadow-sm' : 'px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200';
        }

        function setPracticeOrder(order) {
            practiceOrder = order;
            document.getElementById('btn-seq').className = order === 'sequential' ? 'px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-blue-600 bg-blue-50 text-blue-600 transition' : 'px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50';
            document.getElementById('btn-rand').className = order === 'random' ? 'px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-blue-600 bg-blue-50 text-blue-600 transition' : 'px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50';
            
            if(order === 'random') {
                practiceIndexMap = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);
            } else {
                practiceIndexMap = questions.map((_, i) => i);
            }
            currentIndex = 0;
            renderPracticeQuestion();
        }

        function renderPracticeQuestion() {
            if (questions.length === 0) return;
            const realIdx = practiceIndexMap[currentIndex];
            const q = questions[realIdx];
            const card = document.getElementById('practice-card');
            
            let html = `
                <div class="flex justify-between items-center text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full w-fit">
                    ${q.category}
                </div>
                <h3 class="text-lg font-bold text-gray-900 leading-relaxed">${currentIndex + 1}. ${q.question}</h3>
                <div class="space-y-3 pt-2">
            `;

            q.options.forEach((opt, idx) => {
                const isSelected = userAnswers[realIdx] === idx + 1;
                html += `
                    <button onclick="selectPracticeAnswer(${realIdx}, ${idx + 1})" class="option-btn w-full text-left p-4 rounded-xl border border-gray-200 text-sm font-medium transition flex items-center gap-3 ${isSelected ? 'selected' : ''}">
                        <span class="w-6 h-6 rounded-full border border-gray-300 flex items-center justify-center text-xs font-bold shrink-0">${idx + 1}</span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if(userAnswers[realIdx]) {
                const isCorrect = userAnswers[realIdx] === q.answer;
                html += `
                    <div class="mt-6 p-5 rounded-2xl ${isCorrect ? 'bg-green-50 border border-green-200 text-green-900' : 'bg-red-50 border border-red-200 text-red-900'} text-sm space-y-2 animate-fadeIn">
                        <div class="font-bold text-base flex items-center gap-2">
                            <span>${isCorrect ? '정답입니다! 🎉' : '오답입니다 🥲'}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-white/60 font-semibold">정답: ${q.answer}번</span>
                        </div>
                        <div class="text-gray-700 leading-relaxed">${q.explanation}</div>
                    </div>
                `;
            }

            card.innerHTML = html;
            document.getElementById('practice-page-info').innerText = `${currentIndex + 1} / ${questions.length}`;
        }

        function selectPracticeAnswer(qIdx, optNum) {
            userAnswers[qIdx] = optNum;
            renderPracticeQuestion();
        }

        function movePracticeIndex(dir) {
            const next = currentIndex + dir;
            if(next >= 0 && next < questions.length) {
                currentIndex = next;
                renderPracticeQuestion();
            }
        }

        function startExam() {
            if (questions.length === 0) return;
            const sampleSize = Math.min(50, questions.length);
            examQuestions = [...questions].sort(() => Math.random() - 0.5).slice(0, sampleSize);
            userAnswers = {};
            currentIndex = 0;
            document.getElementById('exam-intro').classList.add('hidden');
            document.getElementById('exam-container').classList.remove('hidden');
            document.getElementById('exam-result').classList.add('hidden');
            renderExamQuestion();
            renderOMR();
            startTimer();
        }

        function renderExamQuestion() {
            const q = examQuestions[currentIndex];
            const card = document.getElementById('exam-card');
            let html = `
                <div class="flex justify-between items-center text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full w-fit">
                    ${q.category}
                </div>
                <h3 class="text-lg font-bold text-gray-900 leading-relaxed">문제 ${currentIndex + 1}. ${q.question}</h3>
                <div class="space-y-3 pt-2">
            `;
            q.options.forEach((opt, idx) => {
                const isSelected = userAnswers[currentIndex] === idx + 1;
                html += `
                    <button onclick="selectExamAnswer(${currentIndex}, ${idx + 1})" class="option-btn w-full text-left p-4 rounded-xl border border-gray-200 text-sm font-medium transition flex items-center gap-3 ${isSelected ? 'selected' : ''}">
                        <span class="w-6 h-6 rounded-full border border-gray-300 flex items-center justify-center text-xs font-bold shrink-0">${idx + 1}</span>
                        <span>${opt}</span>
                    </button>
                `;
            });
            html += `</div>`;
            card.innerHTML = html;
        }

        function selectExamAnswer(eIdx, optNum) {
            userAnswers[eIdx] = optNum;
            renderExamQuestion();
            renderOMR();
        }

        function moveExamIndex(dir) {
            const next = currentIndex + dir;
            if(next >= 0 && next < examQuestions.length) {
                currentIndex = next;
                renderExamQuestion();
            }
        }

        function renderOMR() {
            let html = '';
            for(let i=0; i<examQuestions.length; i++) {
                const answered = userAnswers[i] ? 'bg-blue-600 text-white font-bold shadow-sm' : 'bg-gray-100 text-gray-500 hover:bg-gray-200';
                html += `<button onclick="currentIndex=${i}; renderExamQuestion();" class="w-8 h-8 rounded-lg text-xs font-bold transition ${answered}">${i+1}</button>`;
            }
            document.getElementById('omr-grid').innerHTML = html;
        }

        function startTimer() {
            clearInterval(examTimer);
            timeLeft = 3000;
            examTimer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('exam-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if(timeLeft <= 0) { clearInterval(examTimer); submitExam(); }
            }, 1000);
        }

        function submitExam() {
            clearInterval(examTimer);
            let correctCount = 0;
            examQuestions.forEach((q, i) => {
                if(userAnswers[i] === q.answer) correctCount++;
            });
            let score = Math.round((correctCount / examQuestions.length) * 100);
            
            document.getElementById('exam-container').classList.add('hidden');
            document.getElementById('exam-result').classList.remove('hidden');
            document.getElementById('result-score').innerText = `${score}점`;
            
            const titleEl = document.getElementById('result-title');
            if(score >= 70) {
                titleEl.innerText = "합격 (PASS) 🎉";
                titleEl.className = "text-3xl font-bold text-green-600";
                document.getElementById('result-desc').innerText = `총 ${examQuestions.length}문항 중 ${correctCount}문항을 맞추셨습니다. (합격 기준: 70점)`;
            } else {
                titleEl.innerText = "불합격 (FAIL) 🥲";
                titleEl.className = "text-3xl font-bold text-red-500";
                document.getElementById('result-desc').innerText = `총 ${examQuestions.length}문항 중 ${correctCount}문항을 맞추셨습니다. 70점 이상 달성해 보세요!`;
            }
        }

        function resetExam() {
            document.getElementById('exam-result').classList.add('hidden');
            document.getElementById('exam-intro').classList.remove('hidden');
        }

        window.onload = loadDriveData;
    </script>
</body>
</html>
